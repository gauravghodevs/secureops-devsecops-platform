apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../prometheus
  - ../../grafana
  - ../../alertmanager
  - ../../kube-state-metrics.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kube-state-metrics
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 65534
      - op: add
        path: /spec/template/spec/securityContext/runAsGroup
        value: 65534
