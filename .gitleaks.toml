title = "SecureOps Gitleaks configuration"

[extend]
useDefault = true

# Full git-SHA image tags look like API keys to the generic rule and change on every
# release (the GitOps bot opens a PR per image). Allow that one line shape instead of
# suppressing individual commits.
[allowlist]
description = "Git SHA container image tags in Kubernetes manifests"
regexTarget = "line"
regexes = ['''(image|newTag):\s*\S*[0-9a-f]{40}''']
