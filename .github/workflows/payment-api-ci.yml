name: Payment API CI

on:
  push:
    branches: [main]
    paths:
      - "applications/payment-api/**"
      - "kubernetes/**"
      - "scripts/**"
      - "argocd/**"
      - "observability/**"
      - ".github/workflows/payment-api-ci.yml"
  pull_request:
    paths:
      - "applications/payment-api/**"
      - "kubernetes/**"
      - "scripts/**"
      - "argocd/**"
      - "observability/**"
      - ".github/workflows/payment-api-ci.yml"

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/payment-api

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: applications/payment-api/requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run API tests with coverage
        run: >-
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          -q

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payment-api-coverage
          path: applications/payment-api/coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Check Python style
        run: python -m ruff check app tests

  sonarqube-analysis:
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: payment-api-coverage
          path: applications/payment-api

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: applications/payment-api
          args: >
            -Dsonar.organization=gauravghodevs
            -Dsonar.projectKey=gauravghodevs_secureops-devsecops-platform
            -Dsonar.qualitygate.wait=true

  shell-and-manifest-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate Bash syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Render and verify Kubernetes manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          rendered="$RUNNER_TEMP/secureops-rendered.yaml"

          kubectl kustomize kubernetes/base > "$rendered"

          grep -q '^kind: Deployment$' "$rendered"
          grep -q '^kind: Service$' "$rendered"
          grep -q 'name: payment-api' "$rendered"

          echo "Kubernetes rendering and resource checks passed."

  validate-kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Render application and observability manifests
        run: |
          set -eu
          kubectl kustomize kubernetes/base > rendered-payment-api.yaml
          kubectl kustomize observability > rendered-observability.yaml

      - name: Validate rendered Kubernetes schemas
        run: |
          set -eu
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary - < rendered-payment-api.yaml
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary - < rendered-observability.yaml

      - name: Validate development and OpenShift overlays
        shell: bash
        run: |
          set -Eeuo pipefail

          kubectl kustomize kubernetes/overlays/dev \
            > rendered-dev-overlay.yaml

          kubectl kustomize kubernetes/overlays/openshift \
            > rendered-openshift-overlay.yaml

          echo "Validating development overlay schemas..."
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary - \
            < rendered-dev-overlay.yaml

          echo "Validating standard resources in the OpenShift overlay..."
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -ignore-missing-schemas -summary - \
            < rendered-openshift-overlay.yaml

          echo "Checking required OpenShift Route fields..."
          grep -q '^apiVersion: route.openshift.io/v1$' \
            rendered-openshift-overlay.yaml
          grep -q '^kind: Route$' rendered-openshift-overlay.yaml
          grep -q '^[[:space:]]*termination: edge$' \
            rendered-openshift-overlay.yaml
          grep -q '^[[:space:]]*name: payment-api$' \
            rendered-openshift-overlay.yaml

          echo "Development and OpenShift overlay checks passed."
  docker-build-and-scan:
    runs-on: ubuntu-latest
    needs: [test-and-lint, sonarqube-analysis]
    if: >-
      always() &&
      needs.test-and-lint.result == 'success' &&
      (
        needs.sonarqube-analysis.result == 'success' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork == true &&
          needs.sonarqube-analysis.result == 'skipped'
        )
      )
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build payment API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: applications/payment-api/Dockerfile
          push: false
          load: true
          tags: secureops-payment-api:ci

      - name: Smoke-test container and verify non-root user
        shell: bash
        run: |
          set -Eeuo pipefail

          container_name=payment-api-smoke

          # shellcheck disable=SC2317 # Called indirectly by the EXIT trap.
          cleanup() {
            docker logs "$container_name" 2>/dev/null || true
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$container_name" \
            -p 127.0.0.1:8000:8000 \
            secureops-payment-api:ci

          runtime_user="$(docker inspect \
            --format '{{.Config.User}}' "$container_name")"

          test "$runtime_user" = "10001:0"
          echo "PASS: container is configured to run as non-root."

          for _ in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:8000/health >/dev/null; then
              echo "PASS: payment API health endpoint responded."
              exit 0
            fi

            if [ "$(docker inspect \
              --format '{{.State.Running}}' "$container_name")" != "true" ]; then
              echo "FAIL: container exited before becoming healthy." >&2
              docker logs "$container_name" || true
              exit 1
            fi

            sleep 2
          done

          echo "FAIL: payment API did not become healthy within 60 seconds." >&2
          exit 1

      - name: Generate container image SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: secureops-payment-api:ci
          format: cyclonedx
          output: payment-api-image-sbom.cdx.json
          exit-code: "0"

      - name: Scan image with Trivy (human-readable report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: secureops-payment-api:ci
          format: table
          output: trivy-image.txt
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Scan image with Trivy (enforce security gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: secureops-payment-api:ci
          format: json
          output: trivy-image.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payment-api-trivy-reports
          path: |
            trivy-image.txt
            trivy-image.json
            payment-api-image-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag scanned image for GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/gauravghodevs/secureops-payment-api
          IMAGE_TAG: ${{ github.sha }}
        run: docker tag secureops-payment-api:ci "$IMAGE:$IMAGE_TAG"

      - name: Publish scanned image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/gauravghodevs/secureops-payment-api
          IMAGE_TAG: ${{ github.sha }}
        run: docker push "$IMAGE:$IMAGE_TAG"

  update-gitops:
    name: Open development GitOps pull request
    runs-on: ubuntu-latest
    needs:
      - shell-and-manifest-validation
      - validate-kubernetes
      - docker-build-and-scan
      - test-and-lint
      - sonarqube-analysis
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SECUREOPS_GITOPS_APP_ID }}
          private-key: ${{ secrets.SECUREOPS_GITOPS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: secureops-devsecops-platform
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Prepare GitOps update
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: IMAGE_TAG must be a full Git commit SHA." >&2
            exit 1
          fi

          sed -i -E \
            "s/^([[:space:]]*newTag:).*/\\1 ${IMAGE_TAG}/" \
            kubernetes/overlays/dev/kustomization.yaml

          grep -Eq \
            "^[[:space:]]*newTag: ${IMAGE_TAG}$" \
            kubernetes/overlays/dev/kustomization.yaml

          git diff --check
          git diff -- kubernetes/overlays/dev/kustomization.yaml

      - name: Create GitOps pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_TAG: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail

          BRANCH="automation/gitops-payment-api-${IMAGE_TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"
          git add kubernetes/overlays/dev/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No GitOps change is needed."
            exit 0
          fi

          git commit -m "chore(gitops): update payment-api image to ${IMAGE_TAG}"
          git push origin "$BRANCH"

          gh pr create \
            --repo "$GH_REPO" \
            --base main \
            --head "$BRANCH" \
            --title "chore(gitops): update payment-api image to ${IMAGE_TAG}" \
            --body "Automated GitOps image update.

          - Image: ghcr.io/gauravghodevs/secureops-payment-api
          - Tag: ${IMAGE_TAG}
          - Source: successful main-branch CI workflow
          - Deployment: development overlay only

          Review and merge this PR to allow Argo CD to reconcile the change."
