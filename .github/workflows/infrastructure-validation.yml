name: Infrastructure Validation

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "ansible/**"
      - ".github/workflows/infrastructure-validation.yml"
  pull_request:
    paths:
      - "terraform/**"
      - "ansible/**"
      - ".github/workflows/infrastructure-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-validation:
    name: Terraform Format, Validate & Security Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - terraform/aws-networking
          - terraform/aws-compute

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: ${{ matrix.module }}
        run: terraform validate -no-color

      - name: Scan Terraform configuration with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.module }}
          severity: HIGH,CRITICAL
          exit-code: "1"

  ansible-validation:
    name: Ansible Syntax Validation & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Ansible and Linting Tools
        run: python -m pip install ansible-core==2.19.14 ansible-lint==26.10.1

      - name: Run Ansible Lint
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: ansible-lint ansible/playbooks/

      - name: Check Ansible playbooks syntax
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible-playbook -i ansible/inventory/localhost.ini ansible/playbooks/audit.yml --syntax-check
          ansible-playbook -i ansible/inventory/localhost.ini ansible/playbooks/hardening.yml --syntax-check
