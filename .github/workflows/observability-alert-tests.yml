name: Observability Alert Tests

on:
  push:
    branches: [main]
    paths:
      - "tests/observability/**"
      - "observability/prometheus/alert-rules.yaml"
      - "observability/prometheus/kustomization.yaml"
      - ".github/workflows/observability-alert-tests.yml"
  pull_request:
    paths:
      - "tests/observability/**"
      - "observability/prometheus/alert-rules.yaml"
      - "observability/prometheus/kustomization.yaml"
      - ".github/workflows/observability-alert-tests.yml"

permissions:
  contents: read

jobs:
  alert-rule-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate production alert rules
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD:/workspace" \
            -w /workspace \
            prom/prometheus:v3.5.0 \
            check rules observability/prometheus/alert-rules.yaml

      - name: Test production alert rules
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD:/workspace" \
            -w /workspace \
            prom/prometheus:v3.5.0 \
            test rules tests/observability/alert-tests.yml
