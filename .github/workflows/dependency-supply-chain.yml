name: Dependency Supply Chain Security

on:
  push:
    branches: [main]
    paths:
      - "applications/payment-api/**"
      - ".github/workflows/dependency-supply-chain.yml"
  pull_request:
    paths:
      - "applications/payment-api/**"
      - ".github/workflows/dependency-supply-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit-and-sbom:
    name: Audit Runtime Dependencies and Generate SBOM
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: applications/payment-api

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: applications/payment-api/requirements.lock

      - name: Install locked runtime dependencies
        run: |
          python -m pip install             --only-binary=:all:             --require-hashes             --requirement requirements.lock

      - name: Record runtime dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/secureops-reports"
          python -m pip freeze             > "$RUNNER_TEMP/secureops-reports/runtime-requirements.txt"

      - name: Install security tooling
        run: |
          python -m pip install --only-binary=:all:             pip-audit==2.10.1             cyclonedx-bom==7.5.0

      - name: Audit runtime dependencies
        id: audit
        continue-on-error: true
        run: |
          pip-audit             --requirement requirements.lock             --format json             --output "$RUNNER_TEMP/secureops-reports/payment-api-pip-audit.json"

      - name: Generate runtime CycloneDX SBOM
        run: |
          cyclonedx-py requirements             "$RUNNER_TEMP/secureops-reports/runtime-requirements.txt"             --output-format JSON             --output-file "$RUNNER_TEMP/secureops-reports/payment-api-runtime.cdx.json"

      - name: Upload audit and SBOM reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payment-api-runtime-dependency-security
          path: ${{ runner.temp }}/secureops-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce dependency security gate
        if: steps.audit.outcome != 'success'
        run: |
          echo "::error::Runtime dependency audit failed. Review the uploaded audit report."
          exit 1
