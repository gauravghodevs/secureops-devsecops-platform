apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: payment-api-git-clone
  namespace: default
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/gauravghodevs/secureops-devsecops-platform.git
    - name: revision
      type: string
      default: main
  workspaces:
    - name: output
  steps:
    - name: clone
      image: alpine/git:2.47.2
      script: |
        #!/bin/sh
        set -eu
        rm -rf "$(workspaces.output.path)"/*
        git clone --branch "$(params.revision)" --depth 1 "$(params.repo-url)" "$(workspaces.output.path)"
