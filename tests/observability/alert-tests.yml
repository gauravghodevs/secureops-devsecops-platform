rule_files:
  - ../../observability/prometheus/alert-rules.yaml

evaluation_interval: 15s

tests:
  - name: PaymentAPIDown fires after one minute
    interval: 15s
    input_series:
      - series: 'up{job="kubernetes-services",service="payment-api"}'
        values: '0+0x12'
    alert_rule_test:
      - eval_time: 45s
        alertname: PaymentAPIDown
        exp_alerts: []
      - eval_time: 1m
        alertname: PaymentAPIDown
        exp_alerts:
          - exp_labels:
              job: kubernetes-services
              service: payment-api
              severity: critical
            exp_annotations:
              summary: "Payment API is down"
              description: "Prometheus has been unable to scrape the Payment API for more than one minute."

  - name: PaymentAPITargetsMissing fires when no API target exists
    interval: 15s
    input_series:
      - series: 'up{job="unrelated-job",service="unrelated-service"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 45s
        alertname: PaymentAPITargetsMissing
        exp_alerts: []
      - eval_time: 1m
        alertname: PaymentAPITargetsMissing
        exp_alerts:
          - exp_labels:
              job: kubernetes-services
              service: payment-api
              severity: critical
            exp_annotations:
              summary: "Payment API targets are missing"
              description: "Prometheus cannot find any discovered Payment API targets for more than one minute."

  - name: PaymentAPIHighErrorRate fires when 5xx ratio exceeds 5 percent for 2m
    interval: 1m
    input_series:
      - series: 'payment_api_requests_total{job="kubernetes-services",service="payment-api",http_status="500"}'
        values: '0+20x10'
      - series: 'payment_api_requests_total{job="kubernetes-services",service="payment-api",http_status="200"}'
        values: '0+80x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: PaymentAPIHighErrorRate
        exp_alerts: []
      - eval_time: 7m15s
        alertname: PaymentAPIHighErrorRate
        exp_alerts:
          - exp_labels:
              service: payment-api
              severity: critical
            exp_annotations:
              summary: "Payment API 5xx error rate is above 5%"
              description: "More than 5% of Payment API requests have failed with 5xx responses over the last 5 minutes."
