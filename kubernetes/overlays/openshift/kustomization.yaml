apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Never deploy workloads to the default project on OpenShift.
# Create it first:  oc new-project payment-dev
namespace: payment-dev

resources:
  - ../dev # reuses base + the image tag that CI keeps up to date
  - route.yaml
  - servicemonitor.yaml
