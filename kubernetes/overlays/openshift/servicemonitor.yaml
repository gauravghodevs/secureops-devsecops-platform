# Needs user workload monitoring (see docs/operations/openshift-deployment.md).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: payment-api
  labels:
    app: payment-api
spec:
  selector:
    matchLabels:
      app: payment-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
