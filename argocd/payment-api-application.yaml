apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secureops-payment-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gauravghodevs/secureops-devsecops-platform.git
    targetRevision: main
    path: kubernetes/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # The HPA changes spec.replicas at runtime; without this Argo CD self-heal would keep resetting it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
